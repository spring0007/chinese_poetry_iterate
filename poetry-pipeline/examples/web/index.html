<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>诗词库 · 浏览器检索（读 bundle 分片）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:14px/1.6 "Microsoft YaHei UI",system-ui,sans-serif;
         background:#15181d; color:#d8dee6; }
  header { padding:14px 18px; border-bottom:1px solid #2a2f37; }
  h1 { margin:0; font-size:17px; font-weight:600; }
  .sub { color:#8b949e; font-size:12px; margin-top:4px; }
  main { padding:14px 18px 40px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  input[type=text] { flex:1; min-width:220px; padding:8px 10px; border-radius:6px;
                     border:1px solid #333a44; background:#0f1216; color:#d8dee6; }
  button { padding:8px 14px; border-radius:6px; border:1px solid #3a424e;
           background:#22272f; color:#d8dee6; cursor:pointer; }
  button:hover { background:#2c333d; }
  button:disabled { opacity:.5; cursor:default; }
  select { padding:8px; border-radius:6px; border:1px solid #333a44;
           background:#0f1216; color:#d8dee6; }
  .meta { color:#8b949e; font-size:12px; margin:6px 0 12px; }
  .card { border:1px solid #262c34; border-radius:8px; padding:10px 12px; margin-bottom:8px;
          background:#12161b; }
  .card .t { font-weight:600; color:#e6edf3; }
  .card .w { color:#9aa4b0; font-size:12px; margin-left:8px; }
  .card .b { margin-top:6px; white-space:pre-wrap; color:#c3ccd6; }
  .card .p { margin-top:4px; color:#6e7781; font-size:12px; }
  #err { color:#ff7b72; white-space:pre-wrap; margin:10px 0; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>诗词库 · 浏览器检索</h1>
  <div class="sub">纯前端读 <code>bundle/</code> 分片（zstd 压缩），不依赖任何后端。首次按朝代拉取分片，之后离线可用。</div>
</header>
<main>
  <div class="row">
    <input type="text" id="base" value="../../dist/bundle/" size="34">
    <button id="load">载入清单</button>
    <select id="group"><option value="">（先载入清单）</option></select>
    <button id="fetch" disabled>拉取该组分片</button>
  </div>
  <div class="row">
    <input type="text" id="q" placeholder="关键词 / 作者 / 标题，回车检索">
    <button id="go">检索</button>
  </div>
  <div class="meta" id="meta">未载入</div>
  <div id="err"></div>
  <div id="out"></div>
</main>

<!-- zstd 解压。fzstd 是纯 JS 实现，UMD 包挂到 window.fzstd。
     不同版本暴露的函数名不完全一致，这里做兼容探测，找不到就明确报错而不是静默失败。 -->
<script src="https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js"></script>
<script>
const $ = id => document.getElementById(id);
let MANIFEST = null, RECORDS = [], LOADED = new Set();

function err(msg) { $('err').textContent = msg; }

function pickDecompress() {
  const f = window.fzstd;
  if (!f) return null;
  if (typeof f.decompress === 'function') return f.decompress;
  if (f.ZstdDec && typeof f.ZstdDec.decompress === 'function') return f.ZstdDec.decompress;
  return null;
}

async function loadManifest() {
  err('');
  const base = $('base').value.replace(/\/?$/, '/');
  const r = await fetch(base + 'manifest.json');
  if (!r.ok) throw new Error('读不到 manifest.json（HTTP ' + r.status + '）。' +
    '请确认：①用 http 打开本页而不是 file:// ②bundle 目录路径正确');
  MANIFEST = await r.json();
  const g = new Map();
  for (const s of MANIFEST.shards) {
    const k = s.dynasty + '/' + s.kind;
    const e = g.get(k) || { n: 0, bytes: 0, files: 0 };
    e.n += s.records; e.bytes += s.bytes; e.files++; g.set(k, e);
  }
  const sel = $('group');
  sel.innerHTML = '';
  for (const [k, v] of [...g.entries()].sort((a, b) => b[1].bytes - a[1].bytes)) {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = `${k}  ${v.n} 条 / ${v.files} 片 / ${(v.bytes / 1048576).toFixed(2)} MB`;
    sel.appendChild(o);
  }
  $('fetch').disabled = false;
  $('meta').textContent = `清单已载入：共 ${MANIFEST.total_records} 条 / ${MANIFEST.total_shards} 片，`
    + `schema ${MANIFEST.schema_version}，压缩 ${MANIFEST.compression}`;
}

async function fetchGroup() {
  err('');
  const dec = pickDecompress();
  if (!dec) { err('zstd 解压库未加载：fzstd 的 CDN 没拉下来。'
    + '离线环境请把 fzstd 的 umd/index.js 下载到本地并改本页 <script src>。'); return; }
  const base = $('base').value.replace(/\/?$/, '/');
  const key = $('group').value;
  if (!key) return;
  const [dy, kind] = key.split('/');
  const files = MANIFEST.shards.filter(s => s.dynasty === dy && s.kind === kind);
  const btn = $('fetch'); btn.disabled = true;
  let n = 0;
  for (const s of files) {
    const k = s.file;
    if (LOADED.has(k)) continue;
    const r = await fetch(base + k);
    if (!r.ok) { err('分片拉取失败 ' + k); break; }
    const buf = new Uint8Array(await r.arrayBuffer());
    const out = dec(buf);
    const text = new TextDecoder('utf-8').decode(out);
    for (const line of text.split('\n')) {
      if (!line.trim()) continue;
      RECORDS.push(JSON.parse(line)); n++;
    }
    LOADED.add(k);
    $('meta').textContent = `已载入 ${RECORDS.length} 条（本次 +${n}），正在拉 ${k} …`;
  }
  btn.disabled = false;
  $('meta').textContent = `已载入 ${RECORDS.length} 条 / ${LOADED.size} 个分片，可以直接检索了（离线可用）`;
}

function search() {
  err('');
  const q = $('q').value.trim();
  if (!q) { err('请输入关键词'); return; }
  if (!RECORDS.length) { err('先「拉取该组分片」'); return; }
  const hits = RECORDS.filter(r =>
    (r.t && r.t.includes(q)) || (r.a && r.a.includes(q)) ||
    (r.l && r.l.join('').includes(q)) || (r.r && r.r.includes(q))
  ).slice(0, 100);
  $('meta').textContent = `命中 ${hits.length} 条（最多显示 100）`;
  const out = $('out'); out.innerHTML = '';
  for (const r of hits) {
    const d = document.createElement('div'); d.className = 'card';
    const dy = (r.i >> 27) & 0xF, kd = (r.i >> 24) & 0x7;
    const DYN = ['未详','先秦','汉','五代','唐','宋','元','明','清','近现代',
                 '','','','','','自建'];
    const KIND = ['诗','词','曲','文','经','赋','论著'];
    d.innerHTML = `<div><span class="t">《${esc(r.t || '')}》</span>`
      + `<span class="w">${esc(r.a || '佚名')} · ${DYN[dy] || dy}/${KIND[kd] || kd}`
      + ` · id=${r.i}</span></div>`
      + `<div class="b">${esc((r.l || []).join('／'))}</div>`
      + (r.r ? `<div class="p">词牌：${esc(r.r)}</div>` : '')
      + (r.g ? `<div class="p">标签：${esc(r.g.join('、'))}</div>` : '');
    out.appendChild(d);
  }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

$('load').onclick = () => loadManifest().catch(e => err(String(e.message || e)));
$('fetch').onclick = () => fetchGroup().catch(e => err(String(e.message || e)));
$('go').onclick = search;
$('q').onkeydown = e => { if (e.key === 'Enter') search(); };
</script>
</body>
</html>
